onboarding = false
[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
kitty_graphics = true

[theme]
name = "one-dark"
auto_switch = false

[keys]
prefix = "ctrl+w"

# herdr-file-viewer
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

# lazygit
[[keys.command]]
key = "prefix+l"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"
description = "open lazygit in popup"

# tuicr
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "tuicr-review"
width = "80%"
height = "80%"
description = "review diff in tuicr, send comments to Claude"
