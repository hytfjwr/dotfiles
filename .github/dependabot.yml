version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directories:
      - "/claude/statusline"
      - "/tools/wezterm-tmux-shim"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/claude/skills/pr-explainer-video"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    groups:
      npm:
        patterns: ["*"]
