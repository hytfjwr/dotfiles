name: Brewfile Check

on:
  push:
    branches: [main]
    paths:
      - "Brewfile"
      - ".github/workflows/brewfile.yml"
  pull_request:
    branches: [main]
    paths:
      - "Brewfile"
      - ".github/workflows/brewfile.yml"
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜日に実行
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Brewfile
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      errors: ${{ steps.check.outputs.errors }}
      removed: ${{ steps.check.outputs.removed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update Homebrew
        run: brew update

      - name: Add taps from Brewfile
        shell: bash
        run: |
          while read -r line; do
            tap_name=${line#*\"}
            tap_name=${tap_name%%\"*}
            echo "Adding tap: $tap_name"
            brew tap "$tap_name" || echo "::warning::Failed to tap $tap_name"
            # Homebrew requires non-official taps to be trusted before loading them
            brew trust --tap "$tap_name" || echo "::warning::Failed to trust $tap_name"
          done < <(grep -E "^tap " Brewfile || true)

      - name: Check package availability
        id: check
        shell: bash
        run: |
          echo "## Brewfile Validation Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          removed_file=$(mktemp)
          touch "$removed_file"

          # Extract the first quoted value of a Brewfile line
          quoted() {
            local v=${1#*\"}
            echo "${v%%\"*}"
          }

          # Check taps
          echo "### Taps" >> "$GITHUB_STEP_SUMMARY"
          while read -r line; do
            tap_name=$(quoted "$line")
            if brew tap-info "$tap_name" &>/dev/null; then
              echo "- ✅ $tap_name" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $tap_name (not found)" >> "$GITHUB_STEP_SUMMARY"
              echo "tap:$tap_name" >> "$removed_file"
            fi
          done < <(grep -E "^tap " Brewfile || true)

          # Check brew packages
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Formulae (brew)" >> "$GITHUB_STEP_SUMMARY"
          while read -r line; do
            pkg=$(quoted "$line")
            if brew info "$pkg" &>/dev/null; then
              echo "- ✅ $pkg" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $pkg (not found)" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Formula not found: $pkg"
              echo "brew:$pkg" >> "$removed_file"
            fi
          done < <(grep -E "^brew " Brewfile || true)

          # Check casks
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Casks" >> "$GITHUB_STEP_SUMMARY"
          while read -r line; do
            cask=$(quoted "$line")
            if brew info --cask "$cask" &>/dev/null; then
              echo "- ✅ $cask" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $cask (not found)" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Cask not found: $cask"
              echo "cask:$cask" >> "$removed_file"
            fi
          done < <(grep -E "^cask " Brewfile || true)

          # Count errors and set outputs
          errors=$(wc -l < "$removed_file" | tr -d ' ')
          echo "errors=$errors" >> "$GITHUB_OUTPUT"

          if [ "$errors" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**$errors package(s) not found in Homebrew**" >> "$GITHUB_STEP_SUMMARY"

            {
              echo 'removed<<EOF'
              cat "$removed_file"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

          rm -f "$removed_file"

      - name: Fail on validation errors (push/PR only)
        if: steps.check.outputs.errors > 0 && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: exit 1

  remove-unavailable:
    name: Open PR removing unavailable packages
    needs: validate
    if: needs.validate.outputs.errors > 0 && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove unavailable packages from Brewfile
        shell: bash
        env:
          REMOVED: ${{ needs.validate.outputs.removed }}
        run: |
          while read -r line; do
            [ -z "$line" ] && continue
            type=${line%%:*}
            name=${line#*:}
            echo "Removing $type: $name"
            # Delete exact-match lines without regex escaping issues
            awk -v prefix="$type \"$name\"" 'index($0, prefix) != 1' Brewfile > Brewfile.tmp
            mv Brewfile.tmp Brewfile
          done <<<"$REMOVED"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          commit-message: "chore: remove unavailable Homebrew packages"
          title: "chore: remove unavailable Homebrew packages"
          body: |
            ## Summary

            The following packages are no longer available in Homebrew and have been removed from the Brewfile:

            ```
            ${{ needs.validate.outputs.removed }}
            ```

            This PR was automatically created by the Brewfile validation workflow.
          branch: chore/remove-unavailable-packages
          delete-branch: true
          reviewers: hytfjwr
          labels: unavailable brew package found
